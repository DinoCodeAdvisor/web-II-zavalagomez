<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino-React</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Agregar el script de Babel -->
    <script src="https://unpkg.com/@babel/standalone"></script>
    <script type="text/babel" src="components/MyButton.jsx"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="root">

    </div>
</body>
<script type="text/babel">
    function App()
    {
        const { useState } = React;
        //0 is the starting value for this variables
        const [ counter, setCounter ] = useState(0) 
        const [ counter2, setCounter2 ] = useState(0)
        const [ visible, setVisible ] = useState(true)
        const [ alumnos, setAlumnos ] = useState(["Juan", "Pedro", "Maria", "Ana"])
        const [ alumnoCalificacion, setAlumnosCalificacion ] = useState([{nombre: "Juan", calificacion: 10},{nombre: "Pepe", calificacion: 10},{nombre: "Pedro", calificacion: 5},{nombre: "Ana", calificacion: 9},])
        
        function verParrafo()
        {
            setVisible(!visible);
        }

        return(
            <div>
                <h1>Hola mundo</h1>
                <p>Esto es react</p>
                <MyButton title="Sumar al contador 1"  counter={counter} setCounter={setCounter} />
                <h2>Contador-1: {counter}</h2>
                <br/>
                <MyButton title="Sumar al contador 2" counter={counter2} setCounter={setCounter2}   />
                <h2>Contador-2: {counter2}</h2>
                
                <div className="container">                
                    {alumnoCalificacion.filter(alumno => alumno.calificacion >= 8).map((alumno, index) => {
                        return <div id="alumno-{{index}}"  style={{display: visible ? 'block': 'none'}}>Este es el alumno {alumno.nombre} y saco {alumno.calificacion}</div>
                    })}
                    
                </div>

                <button onClick={verParrafo}>Ver parrafo</button>
                
            </div>
        )
    }

    function saludar(params)
    {
        alert('Hola Mundo');
    }

    function despedir(params)
    {
        alert('Adios Mundo')
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
</script>
</html>
